name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/identity-organizations

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seneve
          POSTGRES_USER: seneve
          POSTGRES_PASSWORD: seneve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seneve -d seneve"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      LOG_LEVEL: info
      API_PORT: 3000
      WEB_PORT: 3001
      WORKER_HEALTH_PORT: 3002
      DATABASE_URL: postgresql://seneve_app:seneve_app@localhost:5432/seneve?schema=public
      MIGRATION_DATABASE_URL: postgresql://seneve:seneve@localhost:5432/seneve?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
      JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
      JWT_ACCESS_TOKEN_ISSUER: seneve-api
      JWT_ACCESS_TOKEN_AUDIENCE: seneve-clients
      AUTH_COOKIE_SECURE: 'false'
      CORS_ORIGINS: http://localhost:3001
      OTEL_SERVICE_NAME: seneve-ci
      RUN_POSTGRES_INTEGRATION: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Verify pnpm
        run: corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: corepack pnpm db:generate

      - name: Validate Prisma schema
        run: corepack pnpm db:validate

      - name: Apply migrations
        run: corepack pnpm exec prisma migrate deploy --schema database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}

      - name: Verify migrations
        run: corepack pnpm exec prisma migrate status --schema database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}

      - name: Verify PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools
          pg_isready -h localhost -p 5432 -U seneve -d seneve

      - name: Create RLS application role
        env:
          PGPASSWORD: seneve
        run: |
          psql -h localhost -p 5432 -U seneve -d seneve -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE seneve_app
            LOGIN
            PASSWORD 'seneve_app'
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOINHERIT
            NOREPLICATION
            NOBYPASSRLS;
          GRANT CONNECT ON DATABASE seneve TO seneve_app;
          GRANT USAGE ON SCHEMA public TO seneve_app;
          GRANT USAGE ON SCHEMA app TO seneve_app;
          GRANT EXECUTE
            ON ALL FUNCTIONS IN SCHEMA app
            TO seneve_app;
          GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE
            ON ALL TABLES IN SCHEMA public
            TO seneve_app;
          GRANT USAGE, SELECT
            ON ALL SEQUENCES IN SCHEMA public
            TO seneve_app;
          SQL

      - name: Verify Redis
        run: redis-cli -h localhost -p 6379 ping

      - name: Check formatting
        run: corepack pnpm format:check

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Run tests
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build
